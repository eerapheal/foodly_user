    <script>
  function setDynamicMeta(title, description) {
    // Set the title
    document.title = title;

    // Update or create the description meta tag
    let metaDescription = document.querySelector('meta[name="description"]');
    if (!metaDescription) {
      metaDescription = document.createElement('meta');
      metaDescription.name = 'description';
      document.head.appendChild(metaDescription);
    }
    metaDescription.content = description;
  }
</script>

    <style>
        /* Add color constants */
        :root {
            --kPrimary: #30b9b2;
            --kPrimaryLight: #40F3EA;
            --kSecondary: #ff7a4f;
            --kSecondaryLight: #ffe5db;
            --kTertiary: #0078a6;
        }

        /* Loading animation container */
        .loading-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        /* Cards container */
        .card-container {
            position: relative;
            width: 300px;
            height: 100px;
            overflow: hidden;
        }

        /* Card styling */
        .card {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: var(--kPrimary);
            color: #ffffff;
            font-size: 1.2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            opacity: 0;
            transform: translateY(100%);
            animation: slideIn 3s ease-in-out forwards;
            text-align:center;
        }

        /* Animation for sliding cards */
        @keyframes slideIn {
            0% {
                opacity: 0;
                transform: translateY(100%);
            }
            10%, 90% {
                opacity: 1;
                transform: translateY(0);
            }
            100% {
                opacity: 0;
                transform: translateY(-100%);
            }
        }

        /* Loading dots */
        .loading-dots {
            display: flex;
            gap: 10px;
        }

        .loading-dot {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background-color: var(--kPrimary);
            animation: pulse 1.5s infinite ease-in-out;
        }

        /* Animation delays for dots */
        .loading-dot:nth-child(2) {
            animation-delay: 0.3s;
            background-color: var(--kSecondary);
        }

        .loading-dot:nth-child(3) {
            animation-delay: 0.6s;
            background-color: var(--kTertiary);
        }

        /* Pulse animation */
        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 0.6;
            }
            50% {
                transform: scale(1.5);
                opacity: 1;
            }
        }
    </style>

<!-- Custom Loading Indicator -->
<script>
           // Loading Animation
        const loadingContainer = document.createElement('div');
        loadingContainer.classList.add('loading-container');

        // Card Container
        const cardContainer = document.createElement('div');
        cardContainer.classList.add('card-container');
        loadingContainer.appendChild(cardContainer);

        // Cards with Mottos
        const mottos = [
            ["Stay positive!", "Foodly is multi vendor app", "You can make money through it"],
            ["If you have a shop you can upload food", "If you are a driver you can deliver food and make money", "Embrace the journey!"]
        ];
        let round = 0;

        function createCards() {
            cardContainer.innerHTML = ''; // Clear previous cards
            mottos[round % mottos.length].forEach((text, index) => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.textContent = text;
                card.style.animationDelay = `${index * 3}s`;
                cardContainer.appendChild(card);
            });
            round++;
        }

        createCards(); // Initial call
        setInterval(createCards, mottos[0].length * 3000); // Repeat after showing all cards

        // Loading Dots
        const dotsContainer = document.createElement('div');
        dotsContainer.classList.add('loading-dots');
        for (let i = 0; i < 3; i++) {
            const dot = document.createElement('div');
            dot.classList.add('loading-dot');
            dotsContainer.appendChild(dot);
        }

        loadingContainer.appendChild(dotsContainer);
        document.body.appendChild(loadingContainer);

        _flutter.loader.load({
            onEntrypointLoaded: async function (engineInitializer) {
                const appRunner = await engineInitializer.initializeEngine();
                await appRunner.runApp();
                document.body.removeChild(loadingContainer); // Remove once app runs
            }
        });
    </script>
