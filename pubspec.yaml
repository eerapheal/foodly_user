  cached_network_image: ^3.3.0
  flutter_rating_bar: ^4.0.1
  flutter_hooks: ^0.20.3
  http: ^1.1.0
  shimmer: ^3.0.0
  glass: ^2.0.0+2
  flutter_svg: ^2.0.9
  lottie: ^3.1.3
  get_storage: ^2.1.1
  webview_flutter: ^4.4.2
  webview_flutter_android: ^4.1.0
  webview_flutter_wkwebview: ^3.9.4
  flutter_inappwebview: ^6.0.0
  device_preview: ^1.1.0
  firebase_auth: ^5.3.4
